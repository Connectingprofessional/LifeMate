name: Validate chatgpt-free-gemini

on:
  push:
    branches:
      - chatgpt-free-gemini
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: chatgpt-free-gemini
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Gemini secret is available
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          echo "GEMINI_API_KEY is available to this environment."

      - name: Validate Gemini Live auth-token endpoint
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          api_key = os.environ["GEMINI_API_KEY"].strip()
          now = datetime.now(timezone.utc)
          payload = {
              "uses": 1,
              "expireTime": (now + timedelta(minutes=30)).isoformat().replace("+00:00", "Z"),
              "newSessionExpireTime": (now + timedelta(seconds=60)).isoformat().replace("+00:00", "Z"),
          }

          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/auth_tokens",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "content-type": "application/json",
                  "x-goog-api-key": api_key,
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              body = json.loads(error.read().decode("utf-8"))
              print(f"Gemini auth-token request failed with HTTP {error.code}.")
              print(body.get("error", {}).get("message", "Gemini request failed."))
              sys.exit(1)
          except Exception as error:
              print(f"Gemini auth-token request failed: {error}")
              sys.exit(1)

          if not 200 <= status < 300 or not body.get("name"):
              print(f"Gemini auth-token request failed with HTTP {status}.")
              print(body.get("error", {}).get("message", "Gemini did not issue an ephemeral token."))
              sys.exit(1)

          print("Gemini Live auth-token endpoint accepted the configured key.")

          # Do not print the issued token.
          PY

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_AUTH_ENABLED: "true"
