name: Validate chatgpt-free-gemini

on:
  push:
    branches:
      - chatgpt-free-gemini
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: chatgpt-free-gemini
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Gemini secret is available
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          echo "GEMINI_API_KEY is available to this environment."

      - name: Validate Gemini Live auth-token endpoint
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data '{"uses":1,"expireTime":"'"$(date -u -d '+30 minutes' '+%Y-%m-%dT%H:%M:%SZ')" '","newSessionExpireTime":"'"$(date -u -d '+60 seconds' '+%Y-%m-%dT%H:%M:%SZ')" '"}' \
            https://generativelanguage.googleapis.com/v1beta/auth_tokens)"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Gemini auth-token request failed with HTTP $status."
            echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error",{}).get("message","Gemini request failed."))' 2>/dev/null || true
            exit 1
          fi
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("name") else 1)'
          echo "Gemini Live auth-token endpoint accepted the configured key."

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_AUTH_ENABLED: "true"
